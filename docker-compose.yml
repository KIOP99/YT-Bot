version: "3.9"

services:

  # ── YTBot Application (bot + API in one container) ─────────────────────────
  ytbot:
    build: .
    container_name: ytbot_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-19232}:${APP_PORT:-19232}"
    volumes:
      - ./uploads:/app/uploads          # Persist uploaded files
      - ./logs:/app/logs                 # Persist logs
      - ytbot_db:/app/ytbot.db           # SQLite DB (override with PG below)
    depends_on:
      - db                               # Comment out if using SQLite
    networks:
      - ytbot_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-19232}/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── PostgreSQL (production recommended) ────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ytbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ytbot
      POSTGRES_USER: ytbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ytbot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx reverse proxy (optional, for production TLS) ─────────────────────
  # nginx:
  #   image: nginx:alpine
  #   container_name: ytbot_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - ytbot
  #   networks:
  #     - ytbot_net

volumes:
  pg_data:
  ytbot_db:

networks:
  ytbot_net:
    driver: bridge
