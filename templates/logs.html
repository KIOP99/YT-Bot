{% extends "base.html" %}
{% block title %}System Logs — YTBot{% endblock %}
{% block page_title %}System Logs{% endblock %}

{% block content %}

<div class="card">
  <div class="card-header">
    <div>
      <div class="card-title">📋 Application Logs</div>
      <div class="card-subtitle">Last 200 lines · Auto-scrolled to bottom</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button onclick="location.reload()" class="btn btn-ghost btn-sm">🔄 Refresh</button>
      <a href="/security/logs?lines=500" class="btn btn-ghost btn-sm">📄 Show More</a>
    </div>
  </div>

  <div class="code-block" id="log-output">{{ log_content }}</div>
</div>

{% endblock %}

{% block scripts %}
<script>
  // Auto-scroll to bottom
  const logEl = document.getElementById('log-output');
  if (logEl) logEl.scrollTop = logEl.scrollHeight;

  // Color-code log lines
  logEl.innerHTML = logEl.textContent.split('\n').map(line => {
    if (line.includes('ERROR') || line.includes('CRITICAL')) {
      return `<span style="color:#ef4444;">${line}</span>`;
    } else if (line.includes('WARNING') || line.includes('WARN')) {
      return `<span style="color:#f59e0b;">${line}</span>`;
    } else if (line.includes('INFO')) {
      return `<span style="color:#94a3b8;">${line}</span>`;
    } else if (line.includes('DEBUG')) {
      return `<span style="color:#475569;">${line}</span>`;
    }
    return line;
  }).join('\n');
  logEl.scrollTop = logEl.scrollHeight;

  // Auto-refresh every 30s
  setTimeout(() => location.reload(), 30000);
</script>
{% endblock %}
